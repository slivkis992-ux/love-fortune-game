<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Любовная фортуна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1147;--panel:#2C1B6B;--ink:#F7F3FF;--gold:#FFC857;--coral:#FF5D73;--teal:#2EC4B6;--violet:#7B5CFF;--pink:#FF8FB1;--sky:#4CC9F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Nunito,system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(24px,5vw,38px)/1.1 Unbounded,sans-serif;margin:0;color:var(--gold)}
#peers{font-size:14px;opacity:.8}
#roundTitle{font:600 18px Unbounded,sans-serif;margin:22px 0 0}
.stage{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center;margin:20px 0}
@media(max-width:720px){.stage{grid-template-columns:1fr}}
.wheelbox{position:relative;width:min(100%,340px);aspect-ratio:1;margin:auto}
.bulb{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.spinning .bulb:nth-child(even){animation:blink .35s infinite alternate}
.spinning .bulb:nth-child(odd){animation:blink .35s .35s infinite alternate}
@keyframes blink{to{opacity:.15}}
.wheel{position:absolute;inset:16px;border-radius:50%;border:4px solid var(--ink);transition:transform 4.5s cubic-bezier(.12,.7,.1,1);
background:conic-gradient(var(--coral) 0 60deg,var(--gold) 0 120deg,var(--teal) 0 180deg,var(--violet) 0 240deg,var(--pink) 0 300deg,var(--sky) 0 360deg)}
.wheel b{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;text-align:center;line-height:40px;font:800 28px Unbounded,sans-serif;color:var(--bg)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:14px solid transparent;border-top:28px solid var(--ink);z-index:2}
ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ol li{counter-increment:o;padding:8px 12px 8px 14px;border-left:4px solid transparent;border-radius:6px;opacity:.75}
ol li::before{content:counter(o) ". ";font-weight:700}
ol li.win{opacity:1;border-left-color:var(--gold);background:var(--panel);font-weight:700}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{font:800 16px Unbounded,sans-serif;background:var(--gold);color:var(--bg);border:0;border-radius:999px;padding:14px 26px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
#status{min-height:1.5em;color:var(--gold)}
.round{background:var(--panel);border-radius:18px;padding:18px 20px;margin-top:16px}
.round h2{font:600 15px/1.3 Unbounded,sans-serif;margin:0 0 10px;color:var(--gold)}
.round p{margin:0;white-space:pre-wrap;max-width:68ch}
.dl{display:inline-block;margin-top:10px;color:var(--gold);font-size:15px}
.round img{display:block;width:100%;max-width:520px;border-radius:12px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--coral);color:#fff;padding:10px 18px;border-radius:12px;max-width:90vw}
@media(prefers-reduced-motion:reduce){.bulb{animation:none!important}}
</style>
</head>
<body>
<main>
  <header><h1>Любовная фортуна</h1><span id="peers">Подключаемся… (если сервер спал, до минуты)</span></header>
  <div id="roundTitle"></div>
  <section class="stage">
    <div class="wheelbox" id="box"><div class="pointer"></div><div class="wheel" id="wheel"></div></div>
    <div>
      <ol id="opts"></ol>
      <div class="bar">
        <button class="btn" id="spin">Крутить колесо</button>
        <button class="btn" id="next" hidden>Следующий раунд</button>
        <button class="btn" id="again" hidden>Играть заново</button>
      </div>
      <p id="status"></p>
    </div>
  </section>
  <div id="feed"></div>
  <div class="bar"><button class="btn ghost" id="invite">Пригласить Аню</button>
    <button class="btn ghost" id="copy" hidden>Скопировать всю историю</button></div>
</main>
<div id="toast" hidden></div>
<script>
const $ = s => document.querySelector(s);
const code = new URLSearchParams(location.search).get('code') || '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let ROUNDS = [], S = null, ws, angle = 0, until = 0, toastTimer;

// лампочки и цифры на колесе
const box = $('#box'), wheel = $('#wheel');
const bulbs = [], nums = [];
for (let i = 0; i < 20; i++) { const b = document.createElement('i'); b.className = 'bulb'; box.appendChild(b); bulbs.push(b); }
for (let i = 0; i < 6; i++) { const n = document.createElement('b'); n.textContent = i + 1; wheel.appendChild(n); nums.push(n); }
function layout() {
  const w = box.offsetWidth;
  bulbs.forEach((b, i) => { b.style.transform = `rotate(${i * 18}deg) translateY(${-w * 0.47}px)`; });
  nums.forEach((n, i) => { const a = i * 60 + 30; n.style.transform = `rotate(${a}deg) translateY(${-w * 0.28}px) rotate(${-a}deg)`; });
}
layout(); addEventListener('resize', layout);

const later = fn => setTimeout(fn, Math.max(0, until - Date.now()));
const toast = t => { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 5000); };

function turn(index) {
  const target = 360 - (index * 60 + 30), cur = ((angle % 360) + 360) % 360;
  angle += 360 * 5 + ((target - cur) + 360) % 360;
  wheel.style.transform = `rotate(${angle}deg)`;
}
function placeWheel() {
  const res = S.results[S.round];
  wheel.style.transition = 'none';
  angle = res ? 360 - (res.index * 60 + 30) : 0;
  wheel.style.transform = `rotate(${angle}deg)`;
  void wheel.offsetWidth; wheel.style.transition = '';
}

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?code=${encodeURIComponent(code)}`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = ev => { if (ev.code === 4001) $('#peers').textContent = 'Неверный код. Открой ссылку с ?code=…'; else { $('#peers').textContent = 'Переподключаемся…'; setTimeout(connect, 2000); } };
}
function handle(m) {
  if (m.type === 'state') { ROUNDS = m.rounds; S = m.state; until = 0; placeWheel(); render(); }
  else if (!S) return;
  else if (m.type === 'peers') $('#peers').textContent = m.n > 1 ? 'Вы вдвоём 💘' : 'Ждём второго игрока…';
  else if (m.type === 'spin') { S.results[m.round] = { index: m.index, label: m.label }; S.busy = true; until = Date.now() + 4600; turn(m.index); render(); later(render); }
  else if (m.type === 'story') { S.story[m.round] = m.story; later(render); }
  else if (m.type === 'image') { S.images[m.round] = m.url; later(render); }
  else if (m.type === 'idle') { S.busy = false; later(render); }
  else if (m.type === 'error') toast(m.message);
}

function render() {
  if (!S) return;
  const r = S.round, rd = ROUNDS[r], revealed = Date.now() >= until, res = S.results[r];
  const done = !!res && revealed, idle = !S.busy;
  $('#roundTitle').textContent = `Раунд ${r + 1} из ${ROUNDS.length}: ${rd.icon} ${rd.title}`;
  $('#opts').innerHTML = rd.options.map((o, i) => `<li class="${done && res.index === i ? 'win' : ''}">${esc(o)}</li>`).join('');
  box.classList.toggle('spinning', S.busy);
  $('#spin').disabled = !(idle && !res);
  $('#next').hidden = !(done && idle && r < ROUNDS.length - 1);
  $('#again').hidden = !(done && idle && r === ROUNDS.length - 1);
  $('#status').textContent = !S.busy ? '' : !revealed ? 'Колесо крутится…' : !S.story[r] ? 'Фортуна пишет вашу историю…' : 'Рисуем вас в этой сцене…';
  let html = '';
  for (let i = r; i >= 0; i--) {
    if (!S.results[i] || (i === r && !revealed)) continue;
    html += `<article class="round"><h2>${ROUNDS[i].icon} ${esc(ROUNDS[i].title)}: ${esc(S.results[i].label)}</h2>${S.story[i] ? `<p>${esc(S.story[i])}</p>` : ''}${S.images[i] ? `<img src="${esc(S.images[i])}" alt="Дима и Аня в сцене раунда ${i + 1}"><a class="dl" href="${esc(S.images[i])}" download>Сохранить картинку</a>` : ''}</article>`;
  }
  $('#feed').innerHTML = html;
  $('#copy').hidden = !S.story.some(Boolean);
}


const act = type => () => ws.readyState === 1 && ws.send(JSON.stringify({ type }));
$('#spin').onclick = act('spin');
$('#next').onclick = act('next');
$('#again').onclick = act('reset');
$('#copy').onclick = () => navigator.clipboard.writeText(S.story.filter(Boolean).join('\n\n')).then(() => toast('История скопирована'));
$('#invite').onclick = () => navigator.clipboard.writeText(location.origin + '/' + (code ? '?code=' + encodeURIComponent(code) : '')).then(() => toast('Ссылка скопирована. Отправь её Ане'));
connect();
</script>
</body>
</html>
